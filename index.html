<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>고약네컷 — 제5회 고약인의 밤</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <script src="js/qrcode.min.js"></script>
</head>
<body>
  <div id="app">
    <section id="screen-start" class="screen active">
      <div class="start-bg"></div>
      <div class="start-content">
        <p class="eyebrow">PHOTO BOOTH</p>
        <h1 class="brand">고약네컷</h1>
        <p class="subtitle">제5회 고약인의 밤</p>
        <div class="qty-panel">
          <span class="qty-label">출력 매수</span>
          <div class="qty-controls">
            <button type="button" class="qty-btn" id="qty-minus" aria-label="감소">−</button>
            <span class="qty-value" id="qty-value">1</span>
            <button type="button" class="qty-btn" id="qty-plus" aria-label="증가">+</button>
          </div>
        </div>
        <button type="button" class="btn btn-primary" id="btn-start">시작하기</button>
      </div>
      <footer class="event-footer">
        <p>제5회 고약인의 밤</p>
        <p class="footer-brand">고약네컷</p>
      </footer>
    </section>

    <!-- 2. 프레임 선택 — 가이드(1080×1620) 레이아웃 미리보기 -->
    <section id="screen-frame" class="screen">
      <header class="topbar">
        <button type="button" class="btn-text" data-back="start">← 뒤로</button>
        <h2>프레임 선택</h2>
        <span class="topbar-spacer"></span>
      </header>
      <div class="frame-layout">
        <div class="frame-preview-wrap">
          <div class="guide-frame" id="guide-frame">
            <div class="guide-safe"></div>
            <div class="guide-slot" data-n="1"><span>1</span></div>
            <div class="guide-slot" data-n="2"><span>2</span></div>
            <div class="guide-slot" data-n="3"><span>3</span></div>
            <div class="guide-slot" data-n="4"><span>4</span></div>
            <div class="guide-caption" id="guide-caption">
              <span class="guide-caption-title">고약네컷</span>
              <span class="guide-caption-sub">제5회 고약인의 밤</span>
            </div>
            <div class="frame-chrome" id="preview-chrome"></div>
          </div>
          <p class="hint">1080×1620 · 칸 466×690</p>
        </div>
        <div class="frame-picker">
          <div class="frame-grid" id="frame-grid"></div>
          <label class="btn btn-secondary frame-add">
            + 프레임 추가
            <input type="file" id="frame-upload" accept="image/png,image/jpeg,image/webp" hidden />
          </label>
          <button type="button" class="btn btn-primary" id="btn-frame-next" disabled>다음</button>
        </div>
      </div>
    </section>

    <section id="screen-capture" class="screen">
      <header class="topbar">
        <button type="button" class="btn-text" data-back="frame">← 뒤로</button>
        <h2>사진 촬영</h2>
        <span class="progress-badge" id="capture-progress">0/8</span>
      </header>
      <div class="capture-stage">
        <div class="camera-viewport" id="camera-viewport">
          <video id="capture-video" autoplay playsinline muted></video>
          <canvas id="capture-canvas" hidden></canvas>
          <div class="shot-progress" id="shot-progress" aria-live="polite">0/8</div>
          <div class="countdown" id="countdown" hidden></div>
          <div class="shutter-flash" id="shutter-flash"></div>
          <img id="capture-result" class="capture-result" alt="촬영 결과" hidden />
        </div>
        <button type="button" class="btn btn-primary btn-large" id="btn-shoot">촬영시작</button>
      </div>
    </section>

    <section id="screen-select" class="screen">
      <header class="topbar">
        <button type="button" class="btn-text" id="btn-retake">재촬영</button>
        <h2>사진 선택 <span id="select-count">(0/4)</span></h2>
        <span class="topbar-spacer"></span>
      </header>
      <div class="select-layout">
        <div class="select-frame-preview guide-frame" id="select-frame-preview">
          <div class="guide-slot slot" data-slot="0"><span>1</span><img alt="" /></div>
          <div class="guide-slot slot" data-slot="1"><span>2</span><img alt="" /></div>
          <div class="guide-slot slot" data-slot="2"><span>3</span><img alt="" /></div>
          <div class="guide-slot slot" data-slot="3"><span>4</span><img alt="" /></div>
          <div class="guide-caption">
            <span class="guide-caption-title">고약네컷</span>
            <span class="guide-caption-sub">제5회 고약인의 밤</span>
          </div>
          <div class="frame-chrome select-chrome" id="select-chrome"></div>
        </div>
        <div class="thumb-panel">
          <p class="hint">원하는 사진 4장을 순서대로 선택하세요</p>
          <div class="thumb-grid" id="thumb-grid"></div>
          <button type="button" class="btn btn-primary" id="btn-select-next" disabled>합성하기</button>
        </div>
      </div>
    </section>

    <section id="screen-compose" class="screen">
      <header class="topbar">
        <span class="topbar-spacer"></span>
        <h2>사진 합성</h2>
        <span class="topbar-spacer"></span>
      </header>
      <div class="compose-layout">
        <div class="compose-preview-wrap">
          <img id="compose-preview" alt="합성 미리보기" />
          <p class="hint" id="compose-status">고해상도 이미지를 생성하고 있습니다…</p>
        </div>
        <div class="compose-side">
          <div class="qr-box">
            <canvas id="compose-qr-canvas" width="180" height="180"></canvas>
            <p>QR → 사진만 저장</p>
          </div>
          <div class="sms-box">
            <input type="tel" id="sms-phone" class="sms-input" placeholder="휴대폰 번호 (선택)" inputmode="tel" />
            <button type="button" class="btn btn-secondary" id="btn-sms" disabled>문자로 보내기</button>
          </div>
          <button type="button" class="btn btn-primary" id="btn-compose-next" disabled>인쇄하기</button>
        </div>
      </div>
    </section>

    <section id="screen-print" class="screen">
      <header class="topbar">
        <span class="topbar-spacer"></span>
        <h2>사진 인쇄</h2>
        <span class="topbar-spacer"></span>
      </header>
      <div class="print-layout">
        <div class="print-preview-wrap">
          <img id="print-preview" alt="인쇄 미리보기" />
        </div>
        <div class="print-side">
          <div class="qr-box">
            <canvas id="qr-canvas" width="180" height="180"></canvas>
            <p>QR코드를 스캔하여<br />사진을 다운로드하세요</p>
          </div>
          <p class="print-status" id="print-status">CP1500으로 인쇄를 준비합니다…</p>
          <div class="print-actions">
            <button type="button" class="btn btn-primary" id="btn-print">인쇄 시작</button>
            <button type="button" class="btn btn-secondary" id="btn-download">사진 저장</button>
            <button type="button" class="btn btn-secondary" id="btn-sms-print">문자로 보내기</button>
            <button type="button" class="btn btn-secondary" id="btn-home">처음 화면으로</button>
          </div>
        </div>
      </div>
    </section>
  </div>

  <div id="print-area" aria-hidden="true">
    <img id="print-image" alt="" />
  </div>

  <script src="js/audio.js"></script>
  <script src="js/camera.js"></script>
  <script src="js/compose.js"></script>
  <script src="js/share.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
