<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <title>고약네컷 사진 저장</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #0c1018;
      color: #f4f0e6;
      font-family: "Noto Sans KR", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      gap: 20px;
    }
    h1 { margin: 0; font-size: 18px; color: #e8d59a; }
    #photo {
      max-width: min(100%, 420px);
      max-height: 65vh;
      border-radius: 12px;
      border: 1px solid rgba(232, 213, 154, 0.25);
      background: #111;
      display: none;
    }
    #msg { color: #9aa3b5; text-align: center; line-height: 1.5; font-size: 14px; white-space: pre-line; }
    .btn {
      display: block;
      width: min(280px, 100%);
      text-align: center;
      text-decoration: none;
      border-radius: 999px;
      padding: 16px 24px;
      font-size: 16px;
      font-weight: 700;
      background: linear-gradient(135deg, #e8d59a, #c9a227);
      color: #1a1408;
    }
  </style>
</head>
<body>
  <h1>고약네컷</h1>
  <p id="msg">사진을 불러오는 중…</p>
  <img id="photo" alt="고약네컷 사진" />
  <a class="btn" id="btn-save" hidden>사진 저장</a>

  <script src="js/share.js"></script>
  <script>
    (async function () {
      const params = new URLSearchParams(location.search);
      const imgParam = params.get("img");
      const id = params.get("v");
      const msg = document.getElementById("msg");
      const photo = document.getElementById("photo");
      const btnSave = document.getElementById("btn-save");

      try {
        let href = null;

        if (imgParam) {
          href = decodeURIComponent(imgParam);
          photo.src = href;
        } else if (id && typeof PhotoShare !== "undefined") {
          const row = await PhotoShare.loadLocal(id);
          if (!row || !row.dataUrl) throw new Error("not found");
          href = row.dataUrl;
          photo.src = href;
        } else {
          throw new Error("no photo");
        }

        await new Promise((res, rej) => {
          photo.onload = res;
          photo.onerror = rej;
        });

        photo.style.display = "block";
        msg.textContent = "사진을 길게 누르거나\n아래 버튼으로 저장하세요";
        btnSave.hidden = false;
        btnSave.href = href;
        if (href.startsWith("data:")) {
          btnSave.setAttribute("download", "goyak-necut.jpg");
        } else {
          btnSave.setAttribute("download", "goyak-necut.jpg");
          btnSave.target = "_blank";
          btnSave.rel = "noopener";
        }

        // data URL이면 자동 저장 시도
        if (href.startsWith("data:")) {
          setTimeout(() => {
            const a = document.createElement("a");
            a.href = href;
            a.download = "goyak-necut.jpg";
            document.body.appendChild(a);
            a.click();
            a.remove();
          }, 300);
        }
      } catch (e) {
        console.error(e);
        msg.textContent = "사진을 불러오지 못했습니다.\n합성 화면에서 QR을 다시 생성해 주세요.";
      }
    })();
  </script>
</body>
</html>
